		<section align="Center">
			<h2>CV Video</h2>
			<video id="Video" width="60%" height="60%">
				<source src="CV Video.mp4" type="video/mp4">
			</video>
			<br><br>
			<button type="button" onclick="PlayVideo()" 
			class="PlayButton">Play ▶️</button>
			<button type="button" onclick="PauseVideo()" 
			class="PauseButton">Pause ⏸️</button>
			<br>
		</section>
		<section align="Center">
			<h2>CV Audio</h2>
			<audio id="Audio" controls>
				<source src="Motaz' CV Recording.mp3" type="audio/mp3">
			</audio>
			<br><br>
			<button type="button" onclick="PlayAudio()" 
			class="PlayButton">Play ▶️</button>
			<button type="button" onclick="PauseAudio()" 
			class="PauseButton">Pause ⏸️</button>
			<br>
		</section>

		<script>
			var video=document.getElementById("Video");
			var audio=document.getElementById("Audio");
			
			//functions for CV video:
			function PlayVideo()
			{
				video.play();
			}//end function
			
			function PauseVideo()
			{
				video.pause();
			}//end function
		
			//functions for Cv Audio:
			function PlayAudio()
			{
				audio.play();
			}//end function
			
			function PauseAudio()
			{
				audio.pause();
			}//end function
		</script>
